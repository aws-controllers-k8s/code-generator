ignore:
  resource_names:
    - GlobalReplicationGroup
    - CacheCluster
    - CacheSecurityGroup
    - UserGroup
    - CacheParameterGroup
    - CacheSubnetGroup
    - Snapshot
    - User
resources:
  ReplicationGroup:
    fields:
      # Valid: compare.is_ignored suppresses only the generated comparison, and
      # a delta_pre_compare hook can add Spec.Tags to the delta by hand.
      Tags:
        custom_sync: {}
        compare:
          is_ignored: true
