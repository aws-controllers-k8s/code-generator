ignore:
  resource_names:
    - GlobalReplicationGroup
    - CacheCluster
    - CacheSecurityGroup
    - UserGroup
    - CacheParameterGroup
    - CacheSubnetGroup
    - Snapshot
    - User
resources:
  ReplicationGroup:
    fields:
      # Invalid: is_read_only places the field in Status, where there is no
      # user-supplied desired value to sync toward.
      Tags:
        custom_sync: {}
        is_read_only: true
