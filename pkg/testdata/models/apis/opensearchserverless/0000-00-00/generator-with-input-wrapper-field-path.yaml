# Used to test the input_wrapper_field_path feature applied to a ReadMany
# operation. BatchGetLifecyclePolicy is promoted to the ReadMany (List) op and
# its input nests the per-item identifier fields (name, type) inside a
# list-of-structure wrapper member, "identifiers". input_wrapper_field_path
# unwraps that so the adoption / identifier-discovery codegen surfaces both
# Name and Type as identifier members.
ignore:
  resource_names:
      - AccessPolicy
      - Collection
      - SecurityConfig
      - SecurityPolicy
      - VpcEndpoint
  field_paths:
      - CreateSecurityPolicyOutput.SecurityPolicyDetail.Policy
      - CreateSecurityPolicyOutput.SecurityPolicyDetail.ClientToken
      - CreateSecurityPolicyInput.ClientToken
      - CreateCollectionInput.ClientToken
operations:
  CreateLifecyclePolicy:
    output_wrapper_field_path: LifecyclePolicyDetail
  BatchGetLifecyclePolicy:
    operation_type:
    - List
    output_wrapper_field_path: LifecyclePolicyDetails
    input_wrapper_field_path: Identifiers
    resource_name: LifecyclePolicy
resources:
  LifecyclePolicy:
    fields:
      Name:
        is_primary_key: true
        is_immutable: true
        go_tag: json:"name"
      Type:
        is_immutable: true
        go_tag: json:"type"
